# Screw PoC Moshi LoRA configuration.
# Paths and run_dir are filled by the shared scripts/run_experiment.sh launcher.
data:
  train_data: ""
  eval_data: ""
  shuffle: true

moshi_paths:
  hf_repo_id: "llm-jp/llm-jp-moshi-v1"
  config_path: "moshi_lm_kwargs.json"

full_finetuning: false
lora:
  enable: true
  rank: 32
  scaling: 2.0
  ft_embed: false

first_codebook_weight_multiplier: 100.0
text_padding_weight: 0.5
duration_sec: 100
batch_size: 8
num_microbatches: 1
max_steps: 500
max_norm: 1.0
gradient_checkpointing: true
param_dtype: "bfloat16"

optim:
  lr: 2.0e-6
  weight_decay: 0.1
  pct_start: 0.05

seed: 0
log_freq: 5
ckpt_freq: 50
num_ckpt_keep: 5
save_adapters: true
do_ckpt: true
do_eval: true
eval_freq: 25
run_dir: ""
overwrite_run_dir: true
