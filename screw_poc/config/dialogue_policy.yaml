  ESCALATE: "規定値を特定できません。作業を進めず、作業指示書か責任者を確認してください。"
  OUT_OF_SCOPE: "その内容は、このねじ問い合わせシステムには登録されていません。作業指示書か責任者を確認してください。"
  NOT_HEARD: "聞き取れませんでした。もう一度、見える数字や文字をそのまま教えてください。"

