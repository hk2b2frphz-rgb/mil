dataset:
  train_dialogues: 1000
  evaluation_dialogues: 200
  core_dialogues_per_knowledge: 30
  out_of_scope_train: 100
  target_seconds_per_dialogue: [20, 45]
  flows_per_knowledge:
    direct: 8
    clarify: 12
    varied: 6
    unresolved: 4

response_patterns:
  CONFIRM: "確認すると、{slot_label}は{value}ですね。"
  ESCALATE: "規定値を特定できません。作業を進めず、作業指示書か責任者を確認してください。"
  OUT_OF_SCOPE: "その内容は、このねじ問い合わせシステムには登録されていません。作業指示書か責任者を確認してください。"
  NOT_HEARD: "聞き取れませんでした。もう一度、見える数字や文字をそのまま教えてください。"

# TTSへ渡すときだけ使う、ねじ規格・数値の固定読み。表示、評価、知識DBの
# 原文は書き換えない。上から順に置換するため、長い品番・数値を先に置く。
