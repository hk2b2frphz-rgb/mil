# 知識表の slot_values は照合用のキーであって、そのままでは人の言葉にならない。
# 「工程不明」は工程が分からない状態を指す値なので、ユーザーがそれを申告する対話は
# 成り立たない。値ごとに、声に出せるかどうかと、その言い方をここで決める。
#   plain        … そのまま acknowledgements の型に入れて読める
#   unanswerable … ユーザーは答えられない。訊けば答えの出ないまま終わる
#   given        … 質問文そのものに入っている。聞き返さない
#   say/confirm  … 値をそのまま読むと文にならないので、言い方を与える
slot_speech:
  M3: plain
  M4: plain
  M5: plain
  M6: plain
  M8: plain
  M10: plain
  M12: plain
  "M8×1": plain
  "8.8": plain
  "1.25ミリ": plain
  SSH-M3-SD-EL: plain
  SSH-M4-SD-EL: plain
  SSH-M8-SD-EL: plain
  SSH-M10-SD-EL: plain

  工程不明: unanswerable
  部品番号不明: unanswerable
  不明: unanswerable

  "1.0ミリと1.25ミリ": given
  メートルねじとインチねじ: given
  小ねじとタッピンねじ: given

  六角穴:
    say: "頭に六角の穴が空いています。"
    confirm: "確認すると、頭は六角穴ですね。"
  外側が六角:
    say: "頭の外側が六角です。"
    confirm: "確認すると、頭は外側が六角ですね。"
  油あり:
    say: "油が付いています。"
    confirm: "確認すると、油が付いた状態ですね。"
  乾燥:
    say: "乾いています。"
    confirm: "確認すると、表面は乾いていますね。"
  平座金あり:
    say: "平たいワッシャーが入っています。"
    confirm: "確認すると、平座金ありですね。"
  アルミ:
    say: "アルミです。"
    confirm: "確認すると、相手材はアルミですね。"
  タッピンねじ:
    say: "タッピンねじです。"
    confirm: "確認すると、タッピンねじですね。"
  ステンレスねじ:
    say: "ステンレスねじです。"
    confirm: "確認すると、ステンレスねじですね。"
  "2ミリ":
    say: "2ミリです。"
    confirm: "確認すると、板厚は2ミリですね。"
  下穴が大きい:
    say: "下穴が少し大きいみたいです。"
    confirm: "確認すると、下穴が大きめということですね。"
  下穴が小さい:
    say: "下穴が小さいみたいです。"
    confirm: "確認すると、下穴が小さいということですね。"
  ねじ込み初期から固い:
    say: "ねじ込み始めから固いです。"
    confirm: "確認すると、最初から固いということですね。"
  急に固着して動かない:
    say: "急に固まって、動かなくなりました。"
    confirm: "確認すると、途中で動かなくなったということですね。"
  締めても空転する:
    say: "締めても、ずっと空回りします。"
    confirm: "確認すると、締めても止まらないということですね。"

question_templates:
  train:
    - "{question}"
    - "すみません、{question}"
    - "ちょっと確認です。{question}"
    - "作業中なんですが、{question}"
    - "これについて、{question}"
    - "先輩、{question}"
  evaluation:
    - "今ちょっと困っていて、{question}"
    - "念のため聞きたいんですが、{question}"
    - "現場で確認したいです。{question}"
    - "これ、どう判断すればいいですか。{question}"

# 詳細を伏せた切り出し方。カテゴリ単位にすると、工具の話を訊いておいて
# ピッチの答えが返る、という噛み合わない対話ができてしまうので、intent 単位で持つ。
vague_questions:
  pitch_lookup:
    - "このねじのピッチを知りたいです。"
    - "ねじ山の間隔を知りたいんですが。"
  pitch_designation:
    - "ねじの表示の読み方が分からないです。"
    - "箱に書いてある表記の意味を知りたいです。"
  thread_compatibility:
    - "手元のねじが入るか見てほしいです。"
    - "同じ太さなら使えるのか知りたいです。"
  thread_system_compatibility:
    - "規格の違うねじを使っていいか知りたいです。"
    - "径が近いねじで代用できますか。"
  screw_type_difference:
