slots:
  process_id:
    label: "工程"
    questions:
      - "どの設備・工程の、どの部分ですか？"
      - "作業指示書に工程名や設備名はありますか？"
      - "見える工程番号や設備名を、そのまま教えてください。"
  part_number:
    label: "部品番号"
    questions:
      - "部品番号は分かりますか？"
      - "箱や作業指示書に番号はありますか？"
      - "見える英数字を、そのまま教えてください。"
  head_marking:
    label: "頭部の刻印"
    questions:
      - "ボルト頭部の刻印を教えてください。"
      - "ボルトの頭に数字や文字はありますか？"
      - "『8.8』や『10.9』のような表示があれば、そのまま読んでください。"
  nominal_diameter:
    label: "ねじサイズ"
    questions:
      - "ねじの呼び径を教えてください。"
      - "M6やM8などのサイズは分かりますか？"
      - "箱や指示書に『M』で始まる表示はありますか？"
  thread_designation:
    label: "ねじの表示"
    questions:
      - "ねじの規格表示を教えてください。"
      - "M8かM8かける1のような表示はありますか？"
      - "『M』で始まる文字と数字を、そのまま読んでください。"
  pitch:
    label: "ピッチ"
    questions:
      - "ピッチを教えてください。"
      - "並目か細目か分かりますか？"
      - "箱や指示書に、1.0や1.25のような表示はありますか？"
  drive_type:
    label: "頭部形状"
    questions:
      - "ねじの駆動部形状を教えてください。"
      - "頭は外側が六角ですか、穴が六角ですか、十字ですか？"
      - "工具を当てる部分の形を、見たまま教えてください。"
  screw_type:
    label: "ねじ種類"
    questions:
