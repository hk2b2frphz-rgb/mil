    questions:
      - "潤滑状態を教えてください。"
      - "油やグリスは付いていますか？"
      - "表面は乾いていますか、それとも油で濡れていますか？"
  mating_material:
    label: "相手材"
    questions:
      - "締付け先の材質を教えてください。"
      - "締める相手は、鉄、アルミ、樹脂のどれですか？"
      - "磁石が付く金属ですか、軽い金属ですか、プラスチックですか？"
  plate_thickness:
    label: "板厚"
    questions:
      - "相手材の板厚を教えてください。"
      - "材料の厚さは何ミリですか？"
      - "図面や指示書に書かれた厚さを、そのまま教えてください。"
  washer:
    label: "座金"
    questions:
      - "座金の条件を教えてください。"
      - "平たいワッシャーは入っていますか？"
      - "ねじ頭の下に、薄い輪の部品がありますか？"
  symptom:
