# Qwen3-TTS 1.7B single-V100 throughput profile.
#
# One copy of this two-stage pipeline runs on each visible V100.  The PBS job
# exposes exactly one physical GPU to each process, so both stages use device 0.
# Four processes on four GPUs provide data parallelism; do not use TP=4.
async_chunk: true
dtype: float16

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1
      decode_cudagraph_capture_sizes: [25, 73, 97, 169, 325]
      # Keep Code2Wav CUDA graph *capture* at B=1 on a 32 GB V100. Capture
      # shapes are the Cartesian product of these two lists, and warming up
      # B=4 x 325 exhausts VRAM. Runtime batches larger than any captured
      # shape simply fall back to eager, so this alone fixes the warmup OOM.
      # Do not also cap the runtime decode batch (decode_batch_max_size): the
      # OOM is a capture-time cost, and throttling the live decoder drives a
      # path that indexes past the B=1 buffers and aborts the CUDA context
      # with a device-side assert.
      decode_cudagraph_batch_sizes: [1]

stages:
  - stage_id: 0
    max_num_seqs: 16
    gpu_memory_utilization: 0.30
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 32768
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      min_tokens: 2
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    max_num_seqs: 16
    gpu_memory_utilization: 0.30
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0
