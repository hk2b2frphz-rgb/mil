# Master experiment config: one YAML for the whole pipeline.
#
# Stages self-chain: each stage is its own PBS job and, on success, submits its
# `next:` stage. No central submitter job, no dependency-held jobs -- only the
# current stage ever consumes resources.
#
# Copy this to a working file (gitignored) and edit it, then start the chain
# from the login node (the --start command is instant; it just submits stage 1):
#   cp configs/experiment.example.yaml configs/experiment.local.yaml
#   uv run python scripts/run_experiment_dag.py --start --dry-run   # inspect
#   uv run python scripts/run_experiment_dag.py --start             # go
#
# You can also start mid-chain, e.g. re-run eval alone:
#   uv run python scripts/run_experiment_dag.py --start-at eval --no-chain
#
# Requires that qsub works on the compute nodes (each stage submits the next
# from within its job). Judge steps (Azure / llm-jp) run on a local PC and are
# not a stage here -- run them after eval (see docs/full_duplex_evaluation.md).

experiment: exp01
out_root: data/runs/exp01

# Proxy exported into every stage's job env (blank = skip).
proxy:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""

# ${name} variables usable in any env value below.
vars:
  base_exp: lora_base_config
  source_batch_id: qwen_dialogues_1000_v1

# Per-stage output directories. Because these are ${name}-usable below, you can
# start mid-chain and still point a stage at an earlier stage's output, e.g.
# start at `tts` and it reads ${dialogue_out}:
#   uv run python scripts/run_experiment_dag.py --start-at tts
paths:
  dialogue_out: "${out_root}/dialogue"
  tts_out: "${out_root}/tts"
  train_out: "${out_root}/checkpoints"
  eval_out: "${out_root}/eval"

# Where the chain starts (omit to start at the first stage).
start: dialogue

# Applied to every stage unless the stage overrides it.
default_resources:
  queue: xvn_s
  select: "1:res=small"
  walltime: "24:00:00"

stages:
  # 1) LLM dialogue generation -> ${dialogue_out}/dialogues.jsonl
  - name: dialogue
    pbs: scripts/run_dialogues_qwen_1000.pbs
    resources: {queue: xvn_s, select: "1:res=small", walltime: "24:00:00"}
    env:
      BATCH_ID: "${source_batch_id}"
      OUT_DIR: "${dialogue_out}"          # adjust to the dialogue script's output var
    next: tts

  # 2) Whole-utterance Qwen3-TTS synthesis (4 GPU): reads ${dialogue_out}, writes ${tts_out}
  - name: tts
    pbs: scripts/run_qwen_tts_whole_utterance_1000_4gpu.pbs
    resources: {queue: xvn_s, select: "1:res=middle2", walltime: "24:00:00"}
    env:
      SOURCE_BATCH_ID: "${source_batch_id}"
      DIALOGUES_JSONL: "${dialogue_out}/dialogues.jsonl"
      OUT_ROOT: "${tts_out}"
    next: train

  # 3) Moshi fine-tuning: reads ${tts_out}, writes ${train_out}
  - name: train
    pbs: scripts/run_experiment.pbs
    resources: {queue: xan_s, select: "1:res=small", walltime: "24:00:00"}
    env:
      SRC_RUN_DIR: "${tts_out}"
      BASE_EXP: "${base_exp}"
      HP_LR: 2e-6
      HP_LORA_RANK: 32
      HP_MAX_STEPS: 500
    next: eval

  # 4) Full-Duplex-Bench evaluation: reads ${train_out} (no next = end)
  - name: eval
    pbs: scripts/run_full_duplex_eval.pbs
    resources: {queue: xvn_s, select: "1:res=small", walltime: "12:00:00"}
    env:
      MODEL_ID: lora_h01
      MODEL_WEIGHT: "${train_out}/consolidated.safetensors"
