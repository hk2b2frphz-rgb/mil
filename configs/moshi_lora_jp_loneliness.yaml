# Moshi LoRA fine-tune config — Japanese loneliness counseling domain
#
# 約 1 時間分の合成音声 (Qwen3-TTS で生成) を使った軽量な LoRA FT。
# 「動けば良い」段階。VRAM 24GB 1 GPU を想定。
#
# 実行例:
#   torchrun --nproc-per-node 1 -m train configs/moshi_lora_jp_loneliness.yaml

moshi_paths:
  # 日本語 Moshi の重み。英語 Moshi に置き換えたい場合は
  # kyutai/moshiko-pytorch-bf16 など。
  hf_repo_id: "llm-jp/llm-jp-moshi-v1"
  # llm-jp 同梱の config は `moshi_lm_kwargs.json` という名前。
  # 指定しないと moshi-finetune は `config.json` を探して見つからず、
  # 内部の英語 Moshi デフォルト構造にフォールバックして初期化時 segfault する。
  config_path: "moshi_lm_kwargs.json"

run_dir: "./checkpoints/moshi_lora_jp_loneliness"

# 1 サンプル最大 170 秒。実データはほぼ 150 秒以内（240 秒が 1 本だけ）なので、
# その 1 本を除き分割されずに 1 サンプルへ収まる。ここを対話長より短くすると
# 2 個目以降のチャンクが「会話の途中から・冒頭挨拶なし」で始まる教師データに
# なり、固定の冒頭挨拶が学習されなくなる。
duration_sec: 170

# 単一 GPU 想定で小さく。複数 GPU なら 4〜8 に上げる。
batch_size: 1

# ~100 対話 × 数 epoch を想定して 1000 step。
# まずは動作確認、その後増やす。
max_steps: 1000

data:
  # generate_qwen3_tts_data.py が出す manifest を指す。
  train_data: "./data/training_set_v1/synthetic_moshi_train.jsonl"

lora:
  enable: true
  rank: 64
  scaling: 2.0

optim:
  # 2e-6 (moshi-finetune 公式 example の値) では eval loss が下がりきらず、
  # 固定の冒頭挨拶が入らなかった。experiments/lora_base_config と同値。
  lr: 5e-6
  weight_decay: 0.1

# ログ / 保存頻度
log_freq: 10
ckpt_freq: 200

# eval loss が改善しない評価回数で打ち切る（0 で無効）。
early_stopping_patience: 6
early_stopping_min_delta: 0.001

seed: 0
