[project]
name = "mos-gemma-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate",
    "sentencepiece",
    # Gemma 4's Transformers attention path uses os_mask_function, which
    # explicitly requires PyTorch 2.6 or newer. CUDA 11.8 wheels remain fully
    # compatible with V100 (sm_70) and need no CUDA 12.4+ host driver.
    "torch>=2.6.0,<2.7",
    "torchvision>=0.21.0,<0.22",
    # Keep cuDNN explicit: some cluster environments previously resolved the
    # PyTorch wheel without exposing its transitive CUDA runtime package.
    "nvidia-cudnn-cu11>=9.1.0.70,<10",
    "transformers>=5.5.0",
    "numpy",
    "qwen-omni-utils",
    "librosa",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
