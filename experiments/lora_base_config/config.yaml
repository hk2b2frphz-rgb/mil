# lora_base_config — Japanese loneliness counseling LoRA base config
#
# scripts/run_sweep_pair.sh / scripts/run_experiment.pbs の BASE_EXP 既定値
# （各 sweep パターンはこの config.yaml を差分パッチして使う）。
# 設計意図と参考文献は HYPERPARAMS.md を参照。
# データのパス (train_data / eval_data / run_dir) は
# scripts/run_experiment.sh が起動時に書き換える。

data:
  train_data: ""   # auto-filled
  eval_data: ""    # auto-filled (9:1 split)
  shuffle: true

moshi_paths:
  hf_repo_id: "llm-jp/llm-jp-moshi-v1"
  # llm-jp は config を `moshi_lm_kwargs.json` という名前で同梱しており、
  # moshi-finetune がデフォルトで探す `config.json` ではない。
  # 明示しないと loaders._lm_kwargs (Kyutai 英語 Moshi 用) にフォールバックし、
  # 重みとアーキテクチャがずれて初期化時に C++ 側 segfault する。
  config_path: "moshi_lm_kwargs.json"

full_finetuning: false
lora:
  enable: true
  rank: 128         # 公式と同値。以前 32 に落としていたが、固定の冒頭挨拶が
                    # 学習されない原因として容量が疑われたため公式へ戻した。
  scaling: 2.0      # 公式と同値。alpha = rank * scaling = 256。
  ft_embed: false   # 公式と同値

# moshi-finetune 公式 example と同値
first_codebook_weight_multiplier: 100.
text_padding_weight: 0.5

# 1 サンプル 170 秒上限。公式 example は 100 だが、この対話コーパスは
# 23.2% が 100 秒を超える（ほぼ 150 秒以内、240 秒が 1 本）。上限を超えると
# moshi-finetune は対話を均等分割し、2 個目以降のチャンクは「会話の途中から・
# 冒頭挨拶なし」で始まる教師データになる。モデルから見て開始直後と区別が
# つかない状態に逆の正解を与えることになり、固定の冒頭挨拶が学習されない。
duration_sec: 170
batch_size: 16          # 公式と同値。rank 128 と併せると VRAM が厳しい場合は
                        # batch_size 8 / num_microbatches 2 で実効 16 にできる。
num_microbatches: 1     # 公式は未指定（デフォルト 1）。実 batch = 16 × 1 = 16。
max_steps: 2000         # 公式と同値。batch 16 なので延べ 32,000 サンプル。
                        # 24h walltime には収まらない見込み。scripts/run_train_chain.pbs
                        # でジョブを分割すること（docs/train_chaining.md）。
max_norm: 1.0
gradient_checkpointing: true   # 80GB あっても安定性のため ON。OFF にすると速いが activations 巨大化。
param_dtype: "bfloat16"

optim:
  # 公式と同値へ戻した。以前 5e-6 に上げていたのは、2e-6 では eval loss が
  # 下がりきらず固定の冒頭挨拶が入らなかったため。ただし挨拶が壊れた原因は
  # 容量側（rank 32）の疑いが濃くなったので、まず公式の組み合わせで測り直す。
  lr: 2e-6
  weight_decay: 0.1     # 公式と同値
  pct_start: 0.05       # 公式と同値。OneCycleLR warmup 比率
  # scheduler は指定しない = 上流デフォルトの one_cycle（公式と同じ）。
  # warmup_constant はこのリポジトリの追加機能で、公式からの逸脱になる。

seed: 0                 # 公式と同値
log_freq: 1             # 公式と同値
ckpt_freq: 100          # 公式と同値
num_ckpt_keep: 5
save_adapters: true
do_ckpt: true

# 過学習監視。公式は do_eval: false だが、best checkpoint 選択と early stopping
# がこれに依存しているため有効のまま残す（公式に無い後付けの機構）。
do_eval: true
eval_freq: 100          # 公式と同値

# eval loss が改善しない「評価回数」で打ち切る（0 で無効）。step 数ではなく
# 評価回数なので、eval_freq を変えても意味が保たれる。6 × eval_freq 100 =
# 600 step 相当。停止した step は ckpt_freq の境界に乗らなくても必ず保存される。
early_stopping_patience: 6
early_stopping_min_delta: 0.001

# run dir は launcher が埋める
run_dir: ""
overwrite_run_dir: true
