# exp002 — exp001 と同ハイパラで学習データを ~3h に増やした比較実験
#
# 設計意図と参考文献は HYPERPARAMS.md を参照。
# データのパス (train_data / eval_data / run_dir) は
# scripts/run_experiment.sh が起動時に書き換える。

data:
  train_data: ""   # auto-filled
  eval_data: ""    # auto-filled (9:1 split)
  shuffle: true

moshi_paths:
  hf_repo_id: "llm-jp/llm-jp-moshi-v1"
  # llm-jp は config を `moshi_lm_kwargs.json` という名前で同梱しており、
  # moshi-finetune がデフォルトで探す `config.json` ではない。明示しないと
  # 内部デフォルト構造にフォールバックし、初期化時に segfault する。
  config_path: "moshi_lm_kwargs.json"

full_finetuning: false
lora:
  enable: true
  rank: 32          # exp001 と同値（比較のため固定）
  scaling: 2.0
  ft_embed: false

# moshi-finetune 公式 example と同値
first_codebook_weight_multiplier: 100.
text_padding_weight: 0.5

duration_sec: 100
batch_size: 8           # A100 80GB 1GPU 想定（exp001 と同値）
num_microbatches: 1
# 250 sample × 0.9 = 225 train sample / bs 8 = ~28 step/epoch
# exp001 と同じ ~44 epoch を狙うので 28 × 44 ≈ 1230 step ≒ 1200
max_steps: 1200
max_norm: 1.0
gradient_checkpointing: true
param_dtype: "bfloat16"

optim:
  lr: 2e-6              # exp001 と同値（比較のため固定）
  weight_decay: 0.1
  pct_start: 0.05

seed: 0
log_freq: 5
ckpt_freq: 120          # 1200 / 120 = 10 個の保存ポイント（exp001 と同密度）
num_ckpt_keep: 5
save_adapters: true
do_ckpt: true

do_eval: true
eval_freq: 60           # ckpt_freq の半分

run_dir: ""
overwrite_run_dir: true
